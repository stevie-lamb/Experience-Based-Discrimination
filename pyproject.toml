[project]
name = "experience-based-discrimination"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '/epd-env/'

[tool.mypy]
python_version = "3.12"
files = ["src", "market_sim.py", "simulation.py", "robustness_sim.py", "downward_biased_signal_sim.py", "scripts"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
